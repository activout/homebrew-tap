name: Update formulas

# Polls each CLI's latest GitHub release, so the CLI repositories need no token or step of their own.
# Run it by hand (Actions > Update formulas > Run workflow) to pick up a release right away.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: update

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Regenerate formulas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I update.py

      - name: Find changed formulas
        id: changed
        run: |
          names=$(git status --porcelain Formula | sed -E 's|.*Formula/(.*)\.rb|\1|' | tr '\n' ' ')
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "Changed: ${names:-none}"

      # Install and test every changed formula before it is published.
      - name: Test changed formulas
        if: steps.changed.outputs.names != ''
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          NAMES: ${{ steps.changed.outputs.names }}
        run: |
          taps="$(brew --repository)/Library/Taps/activout"
          mkdir -p "$taps" && ln -sfn "$PWD" "$taps/homebrew-tap"
          brew trust activout/tap
          brew style activout/tap
          for name in $NAMES; do
            brew install "activout/tap/$name"
            brew test "activout/tap/$name"
          done

      - name: Commit
        if: steps.changed.outputs.names != ''
        env:
          NAMES: ${{ steps.changed.outputs.names }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "Update $NAMES"
          git push
